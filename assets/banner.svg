<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="TruePix banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04120d"/>
      <stop offset="0.5" stop-color="#0a1f17"/>
      <stop offset="1" stop-color="#020a07"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="18" fill="none" stroke="#1a5c4455" stroke-width="1.5"/>

  <!-- pixel grid mosaic -->
  <g transform="translate(56 52)" opacity="0.9">
    <rect x="0" y="0" width="30" height="30" rx="5" fill="#34d399" opacity="0.85"/>
    <rect x="34" y="0" width="30" height="30" rx="5" fill="#2dd4bf" opacity="0.55"/>
    <rect x="68" y="0" width="30" height="30" rx="5" fill="#34d399" opacity="0.35"/>
    <rect x="0" y="34" width="30" height="30" rx="5" fill="#2dd4bf" opacity="0.4"/>
    <rect x="34" y="34" width="30" height="30" rx="5" fill="#34d399" opacity="0.7"/>
    <rect x="68" y="34" width="30" height="30" rx="5" fill="#2dd4bf" opacity="0.5"/>
    <rect x="0" y="68" width="30" height="30" rx="5" fill="#34d399" opacity="0.3"/>
    <rect x="34" y="68" width="30" height="30" rx="5" fill="#2dd4bf" opacity="0.6"/>
  </g>

  <!-- magnifier with check, over the grid -->
  <g transform="translate(110 108)">
    <g filter="url(#glow)">
      <circle cx="30" cy="0" r="40" fill="#04120dcc" stroke="url(#accent)" stroke-width="6"/>
      <line x1="58" y1="28" x2="96" y2="66" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
      <path d="M12 0 l13 13 24-26" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- title -->
  <text x="300" y="110" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#title)">TruePix</text>
  <text x="303" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#86efac">See the truth behind every pixel.</text>

  <!-- pills -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(303 180)">
      <rect width="118" height="30" rx="15" fill="#04120dcc" stroke="#34d399" stroke-width="1.5"/>
      <text x="59" y="20" text-anchor="middle" fill="#6ee7b7">100% Local</text>
    </g>
    <g transform="translate(435 180)">
      <rect width="110" height="30" rx="15" fill="#04120dcc" stroke="#34d399" stroke-width="1.5"/>
      <text x="55" y="20" text-anchor="middle" fill="#6ee7b7">CPU Only</text>
    </g>
    <g transform="translate(559 180)">
      <rect width="150" height="30" rx="15" fill="#04120dcc" stroke="#34d399" stroke-width="1.5"/>
      <text x="75" y="20" text-anchor="middle" fill="#6ee7b7">Evidence-Based</text>
    </g>
  </g>
</svg>
